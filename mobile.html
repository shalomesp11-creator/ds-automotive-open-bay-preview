<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Bay — Mobile Preview</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #E6E8EB; padding: 40px 0 60px; }
  .mp-head { width: var(--wrap); margin: 0 auto 34px; display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .mp-head h1 { font: 900 48px/.95 var(--display); text-transform: uppercase; color: var(--navy-950); }
  .mp-head p { color: var(--steel-600); max-width: 36em; }
  .phones { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; padding: 0 20px; }
  .phone { display: grid; gap: 14px; justify-items: center; margin: 0; }
  .phone__body { width: 414px; height: 868px; padding: 12px; border-radius: 56px; background: linear-gradient(145deg, #2A2F38, #0B0E13); box-shadow: 0 50px 80px -40px rgba(10,20,40,.7), inset 0 0 0 2px #444B57; position: relative; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; background: #fff; display: block; }
  .phone figcaption { font: 600 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--steel-600); }
  .phone figcaption b { color: var(--red-600); margin-right: 8px; }
</style>
</head>
<body>
<header class="mp-head">
  <div>
    <p class="kicker"><span class="kicker__no">M</span>Mobile · 390 × 844</p>
    <h1>Open Bay on the phone</h1>
  </div>
  <p>Each frame runs the live site at iPhone width. Scroll inside a frame, tap the categories, or open the request form. The Call and Schedule Service buttons stay pinned to the bottom.</p>
</header>
<div class="phones">
  <figure class="phone"><div class="phone__body"><iframe src="index.html" title="Mobile home screen"></iframe></div><figcaption><b>01</b>First screen</figcaption></figure>
  <figure class="phone"><div class="phone__body"><iframe src="index.html#cat=03" title="Mobile service menu"></iframe></div><figcaption><b>02</b>Service menu</figcaption></figure>
  <figure class="phone"><div class="phone__body"><iframe src="index.html#request=Brake%20Pad%20Replacement" title="Mobile service request"></iframe></div><figcaption><b>03</b>Repair order</figcaption></figure>
</div>
</body>
</html>
